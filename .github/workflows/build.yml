name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # mac：同时支持 Apple 芯片和 Intel；ad-hoc 签名（不签名的 .app 下载后会被报「已损坏」）。
          - os: macos-latest
            args: --bundles app,dmg --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            signing: "-"
          - os: windows-latest
            args: --bundles msi,nsis --no-sign
            targets: ""
            signing: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build app
        run: npx tauri build ${{ matrix.args }}
        env:
          APPLE_SIGNING_IDENTITY: ${{ matrix.signing }}
      - uses: actions/upload-artifact@v4
        with:
          name: fluent-${{ matrix.os }}
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
